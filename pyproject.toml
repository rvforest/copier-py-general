[project]
name = "general-copier-template"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rvforest@gmail.com", email = "rvforest@gmail.com" }
]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.vcs]
method = "git" 
match = ["v*"]
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "smallest"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.versioningit.template-fields.version-tuple]
pep440 = true

[tool.hatch.build.targets.wheel]
# This repo is a Copier template, not an importable package.
bypass-selection = true

[dependency-groups]
test = [
    "copier>=9.19",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: generated-project checks that need git, uv, pre-commit, and nox; skipped unless --run-slow is given",
]
